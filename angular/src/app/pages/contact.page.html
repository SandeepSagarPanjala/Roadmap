@if (error()) {
  <h1 class="text-2xl font-bold text-red-400 mb-4">{{ error() | json }}</h1>
}

<button
  class="bg-violet-500 hover:bg-violet-700 text-white px-6 py-2 rounded-full cursor-pointer"
  type="button"
  (click)="getUsers()"
>
  Get Users
</button>

<hr />

<input
  type="text"
  placeholder="Enter name"
  (input)="nameChanged($event)"
  class="w-full max-w-md px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent"
/>
<button
  class="bg-violet-500 hover:bg-violet-700 text-white px-6 py-2 rounded-full cursor-pointer"
  type="button"
  (click)="addUser()"
>
  Add User
</button>

<hr />
<div>
  {{ users() | json }}
</div>
