<div class="min-h-screen bg-slate-950 p-6 md:p-12">
  <!-- Navbar -->
  <nav
    class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-3xl mb-8 p-4 flex justify-between items-center shadow-lg"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-xl bg-linear-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg"
      >
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          />
        </svg>
      </div>
      <span class="text-white font-bold text-xl tracking-wide">NexusPortal</span>
    </div>

    <button
      (click)="logout()"
      class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-slate-800 hover:bg-red-500/20 hover:text-red-400 border border-slate-700 hover:border-red-500/30 transition-all duration-300"
    >
      Sign Out
    </button>
  </nav>

  <!-- Main Content Container -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    <!-- Welcome Card -->
    <div
      class="md:col-span-2 bg-linear-to-br from-indigo-600 to-purple-700 rounded-3xl p-8 relative overflow-hidden shadow-[0_0_40px_rgba(79,70,229,0.2)]"
    >
      <!-- Glass overlay decorations -->
      <div class="absolute inset-0 bg-white/5 backdrop-blur-3xl z-0"></div>
      <div
        class="absolute -right-20 -top-20 w-64 h-64 bg-purple-500 rounded-full mix-blend-screen filter blur-3xl opacity-50 z-0"
      ></div>

      <div class="relative z-10">
        <h1 class="text-4xl font-extrabold text-white mb-2">Secure Dashboard</h1>
        <p class="text-indigo-100 mb-8 max-w-md">
          You have successfully bypassed the 401 Interceptors and are actively using a perfectly
          rotated JSON Web Token.
        </p>

        <div
          class="bg-slate-900/40 backdrop-blur-md rounded-2xl p-4 border border-white/10 inline-block"
        >
          <div class="flex items-center gap-3 text-sm text-white">
            <span class="flex h-3 w-3 relative">
              <span
                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"
              ></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            Session Active & Encrypted
          </div>
        </div>
      </div>
    </div>

    <!-- Token Status Widget -->
    <div
      class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 shadow-xl"
    >
      <h3 class="text-white font-bold text-lg mb-6 flex items-center gap-2">
        <svg
          class="w-5 h-5 text-indigo-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
          />
        </svg>
        Security Status
      </h3>

      <div class="space-y-4">
        <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700">
          <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Access Token</div>
          <div class="text-emerald-400 font-mono text-sm truncate">Ready</div>
        </div>

        <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700">
          <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Refresh Token</div>
          <div class="text-blue-400 font-mono text-sm truncate">Rotating automatically</div>
        </div>
      </div>
    </div>
  </div>
</div>
