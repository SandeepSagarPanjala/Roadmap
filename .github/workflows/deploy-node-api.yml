name: Deploy Node API (Dockerized)
run-name: Backend Deploy by @${{ github.actor }} 🚀

on:
  push:
    branches: [develop] # or main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./node-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # We still need this to inject secrets into the Docker build
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # This one command replaces Install, Build, and Restart!
      - name: Build and Start Containers
        run: docker-compose up -d --build

      # We run migrations INSIDE the container so we don't need pnpm on the Mac
      - name: Run Database Migrations
        run: docker exec cosmos-api-service pnpm run db:migrate

      # Optional: Clean up old, unused Docker images to save space on your Mac
      - name: Docker System Prune
        run: docker image prune -f
