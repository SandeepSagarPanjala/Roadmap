name: Deploy Cosmos Api (Self Hosted)
run-name: Backend Deploy by @${{ github.actor }} 🚀

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  # JOB 1: THE FACTORY (Builds the image on GitHub's clean Linux servers)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./node-api
          push: true
          platforms: linux/arm64
          # Make sure this matches your GHCR path exactly
          tags: ghcr.io/sandeepsagarpanjala/cosmos-api:latest

  # JOB 2: THE STOREFRONT (Runs on your Mac)
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./node-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Create the .env from your GitHub Secret (The 1000 properties)
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          chmod 600 .env

      # 2. Pull the PRE-BUILT image from GitHub and start it
      - name: Deploy to Docker
        run: |
          docker compose pull
          docker compose up -d

      # 3. Run Database Migrations
      - name: Run Database Migrations
        run: |
          sleep 5 
          docker exec cosmos-api-service pnpm run db:migrate

      # 4. Clean up the disk
      - name: Docker System Prune
        run: |
          docker image prune -f
          rm .env # Optional: Remove the file now that RAM has the values
