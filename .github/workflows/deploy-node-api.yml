name: Deploy Cosmos Api (Self Hosted)
run-name: Backend Deploy by @${{ github.actor }} 🚀

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./node-api
          push: true
          tags: ghcr.io/sandeepsagarpanjala/cosmos-api:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ./node-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          chmod 600 .env

      - name: Log in to GHCR without macOS keychain
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy to Docker
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
        run: |
          docker compose pull
          docker compose up -d

      - name: Run Database Migrations
        run: |
          sleep 5
          docker exec cosmos-api-service pnpm run db:migrate

      - name: Docker System Prune
        run: |
          docker image prune -f
          rm -f .env
