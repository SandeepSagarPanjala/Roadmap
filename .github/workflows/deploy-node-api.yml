name: Deploy Node API (Self-Hosted)
on:
  push:
    branches: [develop] # or master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./node-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Install Dependencies
        run: pnpm install

      - name: Run Database Migrations
        run: pnpm run db:migrate

      - name: Build Project
        run: pnpm build

      - name: Restart API
        run: pm2 restart node-api-prod
